# Fork-only build: unit tests for the added providers and spend, then an unsigned
# installer uploaded as a run artifact. release.yml needs the upstream
# updater signing key, which a fork does not have, so this workflow turns
# updater artifacts off instead of signing them.
name: Fork build

on:
  push:
    branches: ["add-commandcode-muse-mistral"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      # The skipped Antigravity test needs a downloaded price catalog
      # (gemini-3.1-pro has no built-in card), which a fresh runner lacks.
      - name: Provider unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- providers::commandcode providers::muse providers::mistral providers::openrouter providers::opencode spend::tests --skip agy_pricing_retries_the_base_slug

      - name: Build installer (no updater signing)
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8NoBOM fork.conf.json
          npm run tauri build -- --config fork.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pane-fork-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
